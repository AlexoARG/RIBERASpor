<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de productos en stock</title>
<link rel="icon" type="image/jpeg" href="imagenes/logo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --bg: #0e1014;
        --bg-soft: #161a21;
        --surface: #1c222c;
        --surface-2: #232a36;
        --border: #2a3140;
        --text: #e8ebf0;
        --text-dim: #97a0b0;
        --accent: #c9a25b;
        --accent-soft: rgba(201, 162, 91, 0.15);
    }
    body {
        font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
    }
    .top {
        background:
            radial-gradient(circle at 20% 0%, rgba(201, 162, 91, 0.18), transparent 50%),
            radial-gradient(circle at 80% 100%, rgba(201, 162, 91, 0.10), transparent 55%),
            linear-gradient(180deg, #12161d 0%, #0e1014 100%);
        color: var(--text);
        padding: 50px 40px;
        border-bottom: 1px solid var(--border);
    }
    .top-inner {
        max-width: 1400px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 50px;
        flex-wrap: wrap;
    }
    .top-left {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        flex-shrink: 0;
    }
    .top .logo {
        display: block;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--accent);
        padding: 4px;
        background: var(--bg-soft);
        box-shadow: 0 6px 24px rgba(201, 162, 91, 0.25);
    }
    .top .descripcion {
        text-align: center;
        max-width: 240px;
    }
    .top .descripcion .linea {
        font-size: 13px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--text);
        font-weight: 500;
        line-height: 1.5;
    }
    .top .descripcion .linea + .linea { margin-top: 4px; }
    .top .descripcion .oficial {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
        font-size: 11px;
        letter-spacing: 1.5px;
        color: var(--text-dim);
        text-transform: uppercase;
        line-height: 1.5;
    }
    .top .descripcion .oficial b { color: var(--accent); font-weight: 600; }
    .top-center {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
    }
    .top .logo-nombre {
        max-width: 360px;
        width: 100%;
        height: auto;
        display: block;
    }
    .top h1 {
        font-family: 'Playfair Display', serif;
        font-size: 42px;
        font-weight: 700;
        letter-spacing: 0.5px;
    }
    .top h1 .accent { color: var(--accent); }
    .top .subtitle {
        color: var(--text-dim);
        font-size: 18px;
        letter-spacing: 4px;
        text-transform: uppercase;
        margin: 0;
    }
    .top .stats {
        display: flex;
        gap: 40px;
        justify-content: center;
        flex-wrap: wrap;
    }
    .top .stats .stat {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
    }
    .top .stats .num { font-size: 24px; font-weight: 700; color: #2dd4bf; }
    .top .stats .lbl { font-size: 11px; letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase; }
    .container { max-width: 1400px; margin: 0 auto; padding: 50px 24px; }
    .filtros {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin: -50px -24px 40px;
        padding: 16px 24px;
        background: rgba(14, 16, 20, 0.92);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
    }
    .filtros:empty { display: none; }
    .filtro-btn {
        font-family: inherit;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 18px;
        background: var(--surface);
        color: var(--text-dim);
        border: 1px solid var(--border);
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        cursor: pointer;
        transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }
    .filtro-btn:hover { color: var(--text); border-color: var(--accent); }
    .filtro-btn.active {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent);
    }
    .filtro-btn .cnt {
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.5px;
        color: var(--text-dim);
        background: var(--surface-2);
        border-radius: 999px;
        padding: 1px 7px;
    }
    .filtro-btn.active .cnt { color: var(--accent); background: rgba(201, 162, 91, 0.18); }
    @media (max-width: 600px) {
        .filtros { gap: 8px; padding: 12px 16px; }
        .filtro-btn { padding: 8px 14px; font-size: 10px; letter-spacing: 1px; }
    }
    @media print { .filtros { display: none !important; } }
    .proveedor { margin-bottom: 70px; }
    .proveedor-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 28px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--border);
        gap: 20px;
        flex-wrap: wrap;
    }
    .proveedor-header h2 {
        font-family: 'Playfair Display', serif;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 1px;
        color: var(--text);
    }
    .proveedor-header h2::before {
        content: '';
        display: inline-block;
        width: 10px;
        height: 10px;
        background: var(--accent);
        margin-right: 14px;
        transform: rotate(45deg);
        vertical-align: middle;
    }
    .prov-stats {
        font-size: 11px;
        color: var(--text-dim);
        letter-spacing: 2px;
        text-transform: uppercase;
    }
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 22px;
    }
    .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 4px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .card:hover {
        transform: translateY(-4px);
        border-color: var(--accent);
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.45);
    }
    .img-wrap {
        aspect-ratio: 1 / 1;
        background: var(--surface-2);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
    }
    .img-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.4s ease;
    }
    .card:hover .img-wrap img { transform: scale(1.04); }
    /* Carrusel para productos con 2+ fotos */
    .carousel {
        position: relative;
        width: 100%;
        height: 100%;
    }
    .carousel-track {
        display: flex;
        width: 100%;
        height: 100%;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
        -ms-overflow-style: none;
    }
    .carousel-track::-webkit-scrollbar { display: none; }
    .carousel-track img {
        width: 100%;
        height: 100%;
        flex-shrink: 0;
        scroll-snap-align: center;
        object-fit: cover;
        transition: transform 0.4s ease;
    }
    .card:hover .carousel-track img { transform: scale(1.04); }
    .carousel-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.2);
        width: 30px;
        height: 30px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
        opacity: 0;
        transition: opacity 0.2s, background 0.2s;
        padding: 0;
    }
    .carousel-btn:hover { background: rgba(0, 0, 0, 0.8); }
    .card:hover .carousel-btn { opacity: 1; }
    .carousel-btn.prev { left: 6px; }
    .carousel-btn.next { right: 6px; }
    .carousel-dots {
        position: absolute;
        bottom: 8px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 6px;
        z-index: 2;
        pointer-events: none;
    }
    .carousel-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.45);
        transition: background 0.2s, transform 0.2s;
    }
    .carousel-dots span.active {
        background: rgba(255, 255, 255, 1);
        transform: scale(1.2);
    }
    .sin-imagen {
        color: var(--text-dim);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
    }
    .card-body {
        padding: 16px 18px 20px;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .card h3 {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.5px;
        line-height: 1.35;
        color: var(--text);
        text-transform: uppercase;
    }
    .meta { display: flex; flex-wrap: wrap; gap: 5px; }
    .badge {
        background: var(--surface-2);
        color: var(--text-dim);
        font-size: 10px;
        font-weight: 500;
        padding: 3px 8px;
        border-radius: 2px;
        letter-spacing: 1px;
        text-transform: uppercase;
        border: 1px solid var(--border);
    }
    .precio {
        font-family: 'Playfair Display', serif;
        font-size: 22px;
        font-weight: 700;
        color: #2dd4bf;
        margin-top: auto;
        padding-top: 6px;
    }
    .btn-consultar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 12px;
        padding: 10px 14px;
        background: #25d366;
        color: #0e1014;
        text-decoration: none;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        border-radius: 3px;
        border: 1px solid #25d366;
        transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-consultar:hover {
        background: #1ebe57;
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(37, 211, 102, 0.3);
    }
    .btn-consultar svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
    }
    @media print {
        .btn-consultar { display: none !important; }
    }
    .contact {
        margin-top: 40px;
        padding: 40px 20px 50px;
        border-top: 1px solid var(--border);
        text-align: center;
        background: linear-gradient(180deg, #0e1014 0%, #12161d 100%);
    }
    .contact h3 {
        font-family: 'Playfair Display', serif;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 1px;
        color: var(--text);
        margin-bottom: 22px;
    }
    .contact-list {
        display: flex;
        justify-content: center;
        gap: 32px;
        flex-wrap: wrap;
    }
    .contact-item {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 12px 20px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--text);
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.5px;
        transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .contact-item:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
    }
    .contact-item svg { width: 22px; height: 22px; flex-shrink: 0; }
    .contact-item.ig svg { color: #e1306c; }
    .contact-item.wa svg { color: #25d366; }
    .estado {
        text-align: center;
        padding: 80px 20px;
        color: var(--text-dim);
        font-size: 14px;
        letter-spacing: 2px;
        text-transform: uppercase;
    }
        @media print {
        body { background: white; color: #1a1a1a; }
        .top { background: white !important; color: #1a1a1a !important; border-bottom: 1px solid #ccc; -webkit-print-color-adjust: exact; }
        .top .logo { border-color: #8a6a2e !important; background: white !important; box-shadow: none !important; }
        .top h1 .accent, .top .stats .num, .precio, .proveedor-header h2 { color: #8a6a2e !important; }
        .top .subtitle, .top .stats .lbl, .prov-stats, .badge { color: #555 !important; }
        .card { background: white !important; border: 1px solid #ddd !important; break-inside: avoid; box-shadow: none !important; }
        .img-wrap, .badge { background: #f5f5f5 !important; }
        .proveedor-header { border-color: #ccc !important; }
    }
</style>
</head>

    <script>
    // ========== Catalogo dinamico desde Supabase ==========
    (function() {
        var SUPABASE_URL = 'https://bovuhrcqrhhrbmktmnkj.supabase.co';
        var SUPABASE_KEY = 'sb_publishable_Imhg703t018wXcJw6uNxKQ_o_UxUQsh';
        var H = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY };

        // Como agrupar proveedores en secciones. Si un proveedor no esta aca,
        // se renderiza como seccion propia con su nombre.
        var SECCIONES = [
            { titulo: 'RIBERA SPORT', proveedor_ids: [1, 2] },
            { titulo: 'NOBRAND',      proveedor_ids: [4] },
            { titulo: 'SIXTY',        proveedor_ids: [3] }
        ];
        var GENERO_ORDEN = { MUJER: 0, HOMBRE: 1, UNISEX: 2, ACCESORIOS: 3 };
        // Orden de los botones del filtro (los generos que no esten aca se agregan al final)
        var FILTRO_ORDEN = ['HOMBRE', 'MUJER', 'UNISEX', 'ACCESORIOS'];

        function norm(s){ return (s||'').toString().trim().toUpperCase(); }
        function formatMoney(n){
            var s = (Math.round(n*100)/100).toFixed(2);
            return '$' + s.replace(/\B(?=(\d{3})+(?!\d))/g, '.').replace(/\.(\d{2})$/, ',$1');
        }
        function escapeHtml(s){
            return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }
        function fechaHoy(){
            var d = new Date();
            var dd = String(d.getDate()).padStart(2,'0');
            var mm = String(d.getMonth()+1).padStart(2,'0');
            return dd+'/'+mm+'/'+d.getFullYear();
        }

        async function fetchJSON(url){
            var r = await fetch(url, { headers: H });
            if (!r.ok) throw new Error('HTTP '+r.status+' '+url);
            return r.json();
        }

        function parseUrls(raw){
            if (!raw) return [];
            return String(raw).split(/\r?\n/).map(function(s){ return s.trim(); }).filter(Boolean);
        }

        var WHATSAPP_NUM = '541134925262';
        function buildWhatsappUrl(g){
            var detalles = [];
            if (g.genero) detalles.push(g.genero);
            if (g.talle)  detalles.push('talle ' + g.talle);
            if (g.color)  detalles.push('color ' + g.color);
            var detalle = detalles.length ? ' (' + detalles.join(', ') + ')' : '';
            var msg = 'Hola! Quería consultar por este producto: ' + g.nombre + detalle + ' - ' + formatMoney(g.precio);
            return 'https://wa.me/' + WHATSAPP_NUM + '?text=' + encodeURIComponent(msg);
        }

        function renderCard(g){
            var urls = parseUrls(g.imagen_url);
            var imgHtml;
            if (urls.length === 0) {
                imgHtml = '<div class="sin-imagen">Sin imagen</div>';
            } else if (urls.length === 1) {
                imgHtml = '<img src="' + escapeHtml(urls[0]) + '" alt="' + escapeHtml(g.nombre) + '" loading="lazy">';
            } else {
                var alt = escapeHtml(g.nombre);
                var imgs = urls.map(function(u){
                    return '<img src="' + escapeHtml(u) + '" alt="' + alt + '" loading="lazy">';
                }).join('');
                var dots = urls.map(function(_, i){
                    return '<span' + (i === 0 ? ' class="active"' : '') + '></span>';
                }).join('');
                imgHtml = '<div class="carousel">' +
                            '<div class="carousel-track">' + imgs + '</div>' +
                            '<button class="carousel-btn prev" type="button" aria-label="Anterior">&lsaquo;</button>' +
                            '<button class="carousel-btn next" type="button" aria-label="Siguiente">&rsaquo;</button>' +
                            '<div class="carousel-dots">' + dots + '</div>' +
                          '</div>';
            }
            var badges = [];
            if (g.genero) badges.push('<span class="badge">' + escapeHtml(g.genero) + '</span>');
            if (g.talle)  badges.push('<span class="badge">TALLE: ' + escapeHtml(g.talle) + '</span>');
            if (g.color)  badges.push('<span class="badge">' + escapeHtml(g.color) + '</span>');
            var waUrl = buildWhatsappUrl(g);
            var waIcon = '<svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">' +
                '<path d="M17.47 14.38c-.3-.15-1.74-.86-2.01-.96-.27-.1-.47-.15-.66.15-.2.3-.76.96-.94 1.16-.17.2-.34.22-.64.07-.3-.15-1.25-.46-2.38-1.46-.88-.78-1.47-1.75-1.65-2.05-.17-.3-.02-.46.13-.61.13-.13.3-.34.45-.51.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.66-1.6-.91-2.18-.24-.57-.48-.49-.66-.5l-.56-.01a1.08 1.08 0 0 0-.79.37c-.27.3-1.03 1.01-1.03 2.46 0 1.45 1.06 2.85 1.2 3.05.15.2 2.08 3.18 5.04 4.46.7.3 1.25.48 1.68.62.71.22 1.35.19 1.86.12.57-.09 1.74-.71 1.99-1.4.25-.69.25-1.27.17-1.4-.07-.13-.27-.2-.57-.35Zm-5.42 7.4h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.87 9.87 0 0 1-1.51-5.26 9.91 9.91 0 0 1 9.9-9.9 9.85 9.85 0 0 1 7 2.9 9.83 9.83 0 0 1 2.9 7c0 5.46-4.45 9.9-9.91 9.9Zm8.42-18.32A11.81 11.81 0 0 0 12.05 0C5.5 0 .17 5.34.17 11.89c0 2.1.55 4.14 1.6 5.94L.05 24l6.31-1.66a11.88 11.88 0 0 0 5.69 1.45h.01c6.56 0 11.89-5.34 11.89-11.89A11.82 11.82 0 0 0 20.47 3.46Z"/>' +
                '</svg>';
            return '<div class="card">' +
                  '<div class="img-wrap">' + imgHtml + '</div>' +
                  '<div class="card-body">' +
                    '<h3>' + escapeHtml(g.nombre) + '</h3>' +
                    '<div class="meta">' + badges.join('') + '</div>' +
                    '<div class="precio">' + formatMoney(g.precio) + '</div>' +
                    '<a class="btn-consultar" href="' + waUrl + '" target="_blank" rel="noopener">' + waIcon + 'Consultar</a>' +
                  '</div>' +
                '</div>';
        }

        function attachCarousels(root){
            root.querySelectorAll('.carousel').forEach(function(carousel){
                var track = carousel.querySelector('.carousel-track');
                var dots = carousel.querySelectorAll('.carousel-dots span');
                var n = track.children.length;
                function idx(){
                    return Math.round(track.scrollLeft / track.clientWidth);
                }
                function goto(i){
                    // Loop circular: si pasa del ultimo vuelve al primero (y viceversa)
                    i = ((i % n) + n) % n;
                    track.scrollTo({ left: i * track.clientWidth, behavior: 'smooth' });
                }
                carousel.querySelector('.prev').addEventListener('click', function(e){
                    e.stopPropagation();
                    goto(idx() - 1);
                });
                carousel.querySelector('.next').addEventListener('click', function(e){
                    e.stopPropagation();
                    goto(idx() + 1);
                });
                track.addEventListener('scroll', function(){
                    var i = idx();
                    dots.forEach(function(d, j){ d.classList.toggle('active', j === i); });
                });

                // Swipe tactil: si ya estabas en el borde y haces swipe hacia
                // afuera, loop circular al otro extremo (igual que los botones).
                var startX = 0, startIdx = 0;
                track.addEventListener('touchstart', function(e){
                    startX = e.touches[0].clientX;
                    startIdx = idx();
                }, { passive: true });
                track.addEventListener('touchend', function(e){
                    var dx = e.changedTouches[0].clientX - startX;
                    if (Math.abs(dx) < 40) return;
                    if (dx < 0 && startIdx === n - 1) goto(0);        // swipe izq en la ultima -> primera
                    else if (dx > 0 && startIdx === 0) goto(n - 1);   // swipe der en la primera -> ultima
                }, { passive: true });
            });
        }

        function sortGrupos(a, b){
            var ga = GENERO_ORDEN[norm(a.genero)] != null ? GENERO_ORDEN[norm(a.genero)] : 99;
            var gb = GENERO_ORDEN[norm(b.genero)] != null ? GENERO_ORDEN[norm(b.genero)] : 99;
            if (ga !== gb) return ga - gb;
            if (a.nombre !== b.nombre) return a.nombre.localeCompare(b.nombre);
            if ((a.talle||'') !== (b.talle||'')) return (a.talle||'').localeCompare(b.talle||'');
            return (a.color||'').localeCompare(b.color||'');
        }

        // ---- Filtro por genero ----
        var GRUPOS = [];        // todos los productos agrupados
        var SECCIONES_TODAS = []; // secciones ya ordenadas
        var filtroActual = 'TODOS';

        function renderCatalogo(){
            var visibles = filtroActual === 'TODOS'
                ? GRUPOS
                : GRUPOS.filter(function(g){ return norm(g.genero) === filtroActual; });

            var html = '';
            SECCIONES_TODAS.forEach(function(sec){
                var items = visibles.filter(function(g){ return sec.proveedor_ids.indexOf(g.proveedor_id) >= 0; });
                if (items.length === 0) return;
                items.sort(sortGrupos);
                var unidades = items.reduce(function(s,g){ return s+g.stock; }, 0);
                html += '<section class="proveedor">' +
                    '<div class="proveedor-header">' +
                        '<h2>' + escapeHtml(sec.titulo) + '</h2>' +
                        '<div class="prov-stats">' + items.length + ' PRODUCTOS &middot; ' + unidades + ' UNIDADES</div>' +
                    '</div>' +
                    '<div class="grid">' + items.map(renderCard).join('') + '</div>' +
                '</section>';
            });

            var root = document.getElementById('catalogo');
            root.innerHTML = html || '<div class="estado">Sin productos en esta categoria</div>';
            attachCarousels(root);
        }

        function renderFiltros(){
            // Contar solo lo que realmente se renderiza (un producto sin proveedor
            // valido no cae en ninguna seccion, asi que no debe sumar al badge)
            var visibles = GRUPOS.filter(function(g){
                return SECCIONES_TODAS.some(function(sec){ return sec.proveedor_ids.indexOf(g.proveedor_id) >= 0; });
            });
            var conteo = { TODOS: visibles.length };
            visibles.forEach(function(g){
                var k = norm(g.genero);
                if (!k) return; // sin genero: solo aparece en TODOS
                conteo[k] = (conteo[k] || 0) + 1;
            });
            var presentes = Object.keys(conteo).filter(function(k){ return k !== 'TODOS'; });
            presentes.sort(function(a, b){
                var ia = FILTRO_ORDEN.indexOf(a), ib = FILTRO_ORDEN.indexOf(b);
                if (ia < 0) ia = 99;
                if (ib < 0) ib = 99;
                if (ia !== ib) return ia - ib;
                return a.localeCompare(b);
            });

            var cont = document.getElementById('filtros');
            // Con una sola categoria el filtro no aporta nada
            if (presentes.length < 2) { cont.innerHTML = ''; return; }

            cont.innerHTML = ['TODOS'].concat(presentes).map(function(k){
                return '<button type="button" class="filtro-btn' + (k === filtroActual ? ' active' : '') + '" data-genero="' + escapeHtml(k) + '">' +
                    escapeHtml(k) + '<span class="cnt">' + conteo[k] + '</span>' +
                '</button>';
            }).join('');

            cont.querySelectorAll('.filtro-btn').forEach(function(btn){
                btn.addEventListener('click', function(){
                    filtroActual = btn.getAttribute('data-genero');
                    cont.querySelectorAll('.filtro-btn').forEach(function(b){
                        b.classList.toggle('active', b === btn);
                    });
                    renderCatalogo();
                    // Si estabas scrolleado abajo, volver al inicio de los productos
                    var caja = cont.parentElement;
                    if (caja.getBoundingClientRect().top < 0) {
                        window.scrollTo({ top: caja.offsetTop, behavior: 'smooth' });
                    }
                });
            });
        }

        async function init(){
            try {
                var [productos, proveedores] = await Promise.all([
                    fetchJSON(SUPABASE_URL + '/rest/v1/productos?select=*&stock=gt.0'),
                    fetchJSON(SUPABASE_URL + '/rest/v1/proveedores?select=id,nombre')
                ]);

                // Dedupe por (nombre, color, talle, precio) - sumar stocks
                var mapa = new Map();
                productos.forEach(function(p){
                    var key = [norm(p.nombre), norm(p.color), norm(p.talle), Number(p.precio)].join('||');
                    if (!mapa.has(key)) {
                        mapa.set(key, {
                            nombre: p.nombre, color: p.color, talle: p.talle,
                            precio: Number(p.precio), genero: p.genero,
                            imagen_url: p.imagen_url, proveedor_id: p.proveedor_id,
                            stock: 0
                        });
                    }
                    var g = mapa.get(key);
                    g.stock += (p.stock || 0);
                    if (!g.imagen_url && p.imagen_url) g.imagen_url = p.imagen_url;
                });
                var grupos = Array.from(mapa.values());

                document.getElementById('statProductos').textContent = grupos.length;
                document.getElementById('statUnidades').textContent = grupos.reduce(function(s,g){ return s+g.stock; }, 0);
                document.getElementById('statFecha').textContent = fechaHoy();

                var idsUsados = new Set();
                SECCIONES.forEach(function(s){ s.proveedor_ids.forEach(function(id){ idsUsados.add(id); }); });
                var extras = proveedores
                    .filter(function(p){ return !idsUsados.has(p.id); })
                    .map(function(p){ return { titulo: p.nombre, proveedor_ids: [p.id] }; });
                var todas = SECCIONES.concat(extras);

                // Forzar que COLECCION ARGENTINA aparezca ultima (sin importar acentos)
                function sinAcentos(s){ return norm(s).normalize('NFD').replace(/[̀-ͯ]/g, ''); }
                todas.sort(function(a, b){
                    var aArg = sinAcentos(a.titulo) === 'COLECCION ARGENTINA' ? 1 : 0;
                    var bArg = sinAcentos(b.titulo) === 'COLECCION ARGENTINA' ? 1 : 0;
                    return aArg - bArg;
                });

                GRUPOS = grupos;
                SECCIONES_TODAS = todas;
                if (grupos.length === 0) {
                    document.getElementById('catalogo').innerHTML = '<div class="estado">Sin productos en stock</div>';
                    return;
                }
                renderFiltros();
                renderCatalogo();
            } catch (e) {
                console.error('Error cargando catalogo:', e);
                document.getElementById('catalogo').innerHTML = '<div class="estado">Error cargando catalogo. Recarga la pagina.</div>';
            }
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();
    })();

    // ========== Contador de visitas ==========
    (function() {
        var SUPABASE_URL = 'https://bovuhrcqrhhrbmktmnkj.supabase.co';
        var SUPABASE_KEY = 'sb_publishable_Imhg703t018wXcJw6uNxKQ_o_UxUQsh';
        var TTL_MS = 24 * 60 * 60 * 1000; // 1 visita única por dispositivo cada 24 h
        try {
            var raw = localStorage.getItem('rs_visit');
            var now = Date.now();
            if (raw) {
                var data = JSON.parse(raw);
                if (data && data.expires_at && data.expires_at > now) return;
            }
            var sid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (now + '-' + Math.random().toString(36).slice(2));
            localStorage.setItem('rs_visit', JSON.stringify({ session_id: sid, expires_at: now + TTL_MS }));
            fetch(SUPABASE_URL + '/rest/v1/visitas', {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_KEY,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify({
                    session_id: sid,
                    user_agent: navigator.userAgent,
                    referrer: document.referrer || null
                })
            }).catch(function() {});
        } catch (e) {}
    })();
    </script>
